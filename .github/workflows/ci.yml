name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python source
        run: python -m compileall -q src labs

      - name: Smoke-test chapter lab source
        run: |
          python labs/chapter-03-tools-function-calling-openapi-mcp/compare.py
          python labs/chapter-04-conversational-agents-slot-filling/demo.py
          python labs/chapter-05-memory/demo.py
          python labs/chapter-06-rag-grounding-aegis/demo.py
          python labs/chapter-07-planning/demo.py
          python labs/chapter-08-multi-agent-systems/demo.py
          python labs/chapter-09-routing-and-coordination/demo.py
          python labs/chapter-10-evaluation-and-observability/demo.py
          python labs/chapter-11-security-governance-enterprise-integration/demo.py
